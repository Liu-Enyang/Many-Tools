tests:
- name: login_success
  steps:
  - action: goto
    url: http://localhost:8000/demo/testpage.html
  - action: fill
    target: "#username"
    value: "admin"
  - action: fill
    target: "#password"
    value: "123456"
  - action: click
    target: "#login"
  - action: expect_text
    target: "#result"
    value: "Login success"

- name: login_failed
  steps:
  - action: goto
    url: http://localhost:8000/demo/testpage.html
  - action: fill
    target: "#username"
    value: "admin"
  - action: fill
    target: "#password"
    value: "wrongpassword"
  - action: click
    target: "#login"
  - action: expect_text
    target: "#result"
    value: "Login success"